<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 타워 디펜스 (3D Tower Defense)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;600;800&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            touch-action: manipulation;
            overflow: hidden;
            background-color: #020617;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Glassmorphism Design UI */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover:not(.disabled) {
            border-color: rgba(59, 130, 246, 0.6);
            transform: translateY(-2px);
            background: rgba(30, 41, 59, 0.9);
        }

        .glass-card.selected {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            background: rgba(37, 99, 235, 0.25);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }

        .animate-pulse-subtle {
            animation: pulse-subtle 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="text-white select-none">

    <!-- 3D Canvas Rendering Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer" class="flex flex-col justify-between p-4 md:p-6">
        
        <!-- Top Control Bar -->
        <div class="flex flex-wrap justify-between items-center gap-3 w-full max-w-7xl mx-auto interactive">
            <!-- Stats Display -->
            <div class="glass-panel rounded-2xl px-5 py-3 flex items-center gap-5 md:gap-8 shadow-2xl">
                <!-- Gold -->
                <div class="flex items-center gap-2.5">
                    <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400">
                        <i class="fa-solid fa-coins text-lg"></i>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">골드</div>
                        <div id="gold-display" class="text-xl md:text-2xl font-black font-orbitron text-amber-300">400</div>
                    </div>
                </div>

                <div class="h-8 w-px bg-slate-700/60"></div>

                <!-- Lives -->
                <div class="flex items-center gap-2.5">
                    <div class="w-10 h-10 rounded-xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-400">
                        <i class="fa-solid fa-heart text-lg"></i>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">라이프</div>
                        <div id="lives-display" class="text-xl md:text-2xl font-black font-orbitron text-rose-400">20</div>
                    </div>
                </div>

                <div class="h-8 w-px bg-slate-700/60"></div>

                <!-- Wave -->
                <div class="flex items-center gap-2.5">
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
                        <i class="fa-solid fa-shield-halved text-lg"></i>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">웨이브</div>
                        <div id="wave-display" class="text-xl md:text-2xl font-black font-orbitron text-indigo-300">0 / 15</div>
                    </div>
                </div>
            </div>

            <!-- Controls: Speed & Wave Start -->
            <div class="glass-panel rounded-2xl p-2 flex items-center gap-2 shadow-2xl">
                <button id="btn-speed" class="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs font-bold font-orbitron transition flex items-center gap-2">
                    <i class="fa-solid fa-forward"></i> <span id="speed-text">1x</span>
                </button>
                <button id="btn-start-wave" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-sm shadow-lg shadow-emerald-500/25 transition active:scale-95 flex items-center gap-2">
                    <i class="fa-solid fa-play text-xs"></i> <span>웨이브 시작</span>
                </button>
            </div>
        </div>

        <!-- Selected Tower Control Info Panel -->
        <div id="tower-info-panel" class="hidden interactive self-center glass-panel rounded-2xl p-4 shadow-2xl border border-blue-500/40 flex-col gap-3 min-w-[310px] max-w-sm mb-2 transition-all duration-300">
            <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
                <div>
                    <h3 id="info-tower-name" class="font-bold text-lg text-blue-400">타워 이름</h3>
                    <p id="info-tower-level" class="text-xs text-slate-400">Lv.1</p>
                </div>
                <button id="btn-close-info" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="grid grid-cols-3 gap-2 text-center text-xs py-1">
                <div class="bg-slate-800/80 rounded-lg p-2 border border-slate-700">
                    <div class="text-slate-400 text-[10px]">공격력</div>
                    <div id="info-tower-dmg" class="font-bold text-amber-400 mt-0.5">15</div>
                </div>
                <div class="bg-slate-800/80 rounded-lg p-2 border border-slate-700">
                    <div class="text-slate-400 text-[10px]">사거리</div>
                    <div id="info-tower-range" class="font-bold text-blue-400 mt-0.5">3.5</div>
                </div>
                <div class="bg-slate-800/80 rounded-lg p-2 border border-slate-700">
                    <div class="text-slate-400 text-[10px]">공격 쿨타임</div>
                    <div id="info-tower-speed" class="font-bold text-emerald-400 mt-0.5">1.0s</div>
                </div>
            </div>

            <div class="flex gap-2 pt-1">
                <button id="btn-upgrade-tower" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 font-bold text-xs flex items-center justify-center gap-2 shadow-lg transition disabled:opacity-40 disabled:pointer-events-none">
                    <i class="fa-solid fa-arrow-up"></i>
                    <span>업그레이드 (<span id="upgrade-cost">100</span> G)</span>
                </button>
                <button id="btn-sell-tower" class="px-4 py-2.5 rounded-xl bg-rose-600/20 hover:bg-rose-600/40 border border-rose-500/40 text-rose-300 font-bold text-xs transition flex items-center gap-1.5">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>판매 (+<span id="sell-price">50</span>G)</span>
                </button>
            </div>
        </div>

        <!-- Bottom Tower Selector -->
        <div class="w-full max-w-4xl mx-auto interactive">
            <div class="glass-panel rounded-2xl p-2.5 md:p-3 shadow-2xl flex items-center justify-center gap-2 md:gap-4 overflow-x-auto">
                
                <!-- Gatling Tower -->
                <div data-tower-type="gatling" class="tower-card glass-card rounded-xl p-2.5 cursor-pointer flex flex-col items-center min-w-[95px] md:min-w-[115px] select-none">
                    <div class="w-10 h-10 rounded-lg bg-blue-500/20 border border-blue-400/30 flex items-center justify-center text-blue-400 mb-1.5">
                        <i class="fa-solid fa-crosshair text-xl"></i>
                    </div>
                    <span class="font-bold text-xs text-slate-200">개틀링</span>
                    <span class="text-[11px] text-amber-400 font-bold mt-0.5 font-orbitron">100 G</span>
                </div>

                <!-- Cannon Tower -->
                <div data-tower-type="cannon" class="tower-card glass-card rounded-xl p-2.5 cursor-pointer flex flex-col items-center min-w-[95px] md:min-w-[115px] select-none">
                    <div class="w-10 h-10 rounded-lg bg-red-500/20 border border-red-400/30 flex items-center justify-center text-red-400 mb-1.5">
                        <i class="fa-solid fa-bomb text-xl"></i>
                    </div>
                    <span class="font-bold text-xs text-slate-200">캐논 (범위)</span>
                    <span class="text-[11px] text-amber-400 font-bold mt-0.5 font-orbitron">175 G</span>
                </div>

                <!-- Laser Tower -->
                <div data-tower-type="laser" class="tower-card glass-card rounded-xl p-2.5 cursor-pointer flex flex-col items-center min-w-[95px] md:min-w-[115px] select-none">
                    <div class="w-10 h-10 rounded-lg bg-cyan-500/20 border border-cyan-400/30 flex items-center justify-center text-cyan-400 mb-1.5">
                        <i class="fa-solid fa-bolt text-xl"></i>
                    </div>
                    <span class="font-bold text-xs text-slate-200">레이저 (지속)</span>
                    <span class="text-[11px] text-amber-400 font-bold mt-0.5 font-orbitron">250 G</span>
                </div>

                <!-- Frost Tower -->
                <div data-tower-type="frost" class="tower-card glass-card rounded-xl p-2.5 cursor-pointer flex flex-col items-center min-w-[95px] md:min-w-[115px] select-none">
                    <div class="w-10 h-10 rounded-lg bg-purple-500/20 border border-purple-400/30 flex items-center justify-center text-purple-400 mb-1.5">
                        <i class="fa-solid fa-snowflake text-xl"></i>
                    </div>
                    <span class="font-bold text-xs text-slate-200">프로스트 (둔화)</span>
                    <span class="text-[11px] text-amber-400 font-bold mt-0.5 font-orbitron">150 G</span>
                </div>

            </div>
        </div>
    </div>

    <!-- Game Over / Victory Modal -->
    <div id="game-over-modal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4 transition-all duration-300">
        <div class="glass-panel border-2 border-slate-700 rounded-3xl p-8 max-w-md w-full text-center shadow-2xl">
            <!-- Modal Icon -->
            <div id="modal-icon" class="w-20 h-20 rounded-3xl bg-rose-500/20 border-2 border-rose-500/50 text-rose-400 mx-auto flex items-center justify-center text-4xl mb-4 shadow-lg shadow-rose-500/20 animate-pulse-subtle">
                <i class="fa-solid fa-skull"></i>
            </div>

            <h2 id="modal-title" class="text-3xl font-black font-orbitron text-rose-500 mb-2 tracking-wider">GAME OVER</h2>
            <p id="modal-desc" class="text-slate-300 text-sm mb-6 leading-relaxed">기지가 침략자에게 점령되었습니다.</p>
            
            <div class="bg-slate-900/90 rounded-2xl p-4 border border-slate-800/80 mb-6 grid grid-cols-2 gap-4">
                <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                    <div class="text-[11px] text-slate-400 font-bold uppercase tracking-wide">최종 웨이브</div>
                    <div id="final-wave" class="text-2xl font-black font-orbitron text-indigo-400 mt-1">Wave 0</div>
                </div>
                <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                    <div class="text-[11px] text-slate-400 font-bold uppercase tracking-wide">남은 골드</div>
                    <div id="final-gold" class="text-2xl font-black font-orbitron text-amber-400 mt-1">0 G</div>
                </div>
            </div>

            <button id="btn-restart" class="w-full py-4 rounded-xl bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-bold text-sm shadow-lg shadow-rose-600/30 transition active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right text-lg"></i>
                <span>다시 도전하기</span>
            </button>
        </div>
    </div>

    <!-- MAIN GAME ENGINE & LOGIC -->
    <script>
        const CONFIG = {
            gridX: 12,
            gridZ: 12,
            cellSize: 2,
            startingGold: 400,
            startingLives: 20,
            maxWaves: 15
        };

        const TOWER_TYPES = {
            gatling: {
                name: "개틀링 타워",
                cost: 100,
                range: 4.5,
                damage: 16,
                fireRate: 0.22,
                color: 0x3b82f6,
                type: "single"
            },
            cannon: {
                name: "캐논 타워",
                cost: 175,
                range: 4.0,
                damage: 50,
                splashRadius: 2.2,
                fireRate: 1.2,
                color: 0xef4444,
                type: "area"
            },
            laser: {
                name: "레이저 타워",
                cost: 250,
                range: 5.0,
                damage: 3.2,
                fireRate: 0.05,
                color: 0x06b6d4,
                type: "beam"
            },
            frost: {
                name: "프로스트 타워",
                cost: 150,
                range: 3.8,
                damage: 7,
                slowFactor: 0.45,
                slowDuration: 2.0,
                fireRate: 0.85,
                color: 0xa855f7,
                type: "slow"
            }
        };

        // Grid map path coordinates [x, z]
        const PATH_GRID = [
            [0, 2], [3, 2], [3, 6], [7, 6], [7, 2], [10, 2], [10, 9], [4, 9], [4, 11]
        ];

        // Global Game States
        let scene, camera, renderer;
        let gold = CONFIG.startingGold;
        let lives = CONFIG.startingLives;
        let currentWave = 0;
        let isWaveActive = false;
        let gameSpeed = 1;

        let selectedTowerType = null;
        let selectedPlacedTower = null;

        let gridMap = Array(CONFIG.gridX).fill(null).map(() => Array(CONFIG.gridZ).fill(0));
        let worldPathPoints = [];

        let towers = [];
        let enemies = [];
        let projectiles = [];
        let particleEffects = [];

        let hoverTileMesh = null;
        let rangeIndicatorMesh = null;
        let boardTiles = [];

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let clock = new THREE.Clock();

        function initEngine() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.022);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 22, 24);
            camera.lookAt(12, 0, 11);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
            dirLight.position.set(20, 30, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 100;
            const d = 25;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            buildWorldMap();
            buildHelpers();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerdown', onPointerDown);

            setupUIListeners();
            updateHUD();
            
            animate();
        }

        function buildWorldMap() {
            worldPathPoints = PATH_GRID.map(([gx, gz]) => new THREE.Vector3(
                gx * CONFIG.cellSize + CONFIG.cellSize / 2,
                0,
                gz * CONFIG.cellSize + CONFIG.cellSize / 2
            ));

            for (let i = 0; i < PATH_GRID.length - 1; i++) {
                const p1 = PATH_GRID[i];
                const p2 = PATH_GRID[i + 1];

                const minX = Math.min(p1[0], p2[0]);
                const maxX = Math.max(p1[0], p2[0]);
                const minZ = Math.min(p1[1], p2[1]);
                const maxZ = Math.max(p1[1], p2[1]);

                for (let x = minX; x <= maxX; x++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        gridMap[x][z] = 1;
                    }
                }
            }

            const boardGroup = new THREE.Group();

            for (let x = 0; x < CONFIG.gridX; x++) {
                for (let z = 0; z < CONFIG.gridZ; z++) {
                    const isPath = gridMap[x][z] === 1;
                    const tileGeo = new THREE.BoxGeometry(CONFIG.cellSize - 0.08, 0.4, CONFIG.cellSize - 0.08);
                    
                    const tileMat = new THREE.MeshStandardMaterial({
                        color: isPath ? 0x1e293b : 0x0f172a,
                        roughness: 0.8,
                        metalness: 0.2
                    });

                    const tileMesh = new THREE.Mesh(tileGeo, tileMat);
                    tileMesh.position.set(
                        x * CONFIG.cellSize + CONFIG.cellSize / 2,
                        -0.2,
                        z * CONFIG.cellSize + CONFIG.cellSize / 2
                    );
                    tileMesh.receiveShadow = true;
                    tileMesh.userData = { gridX: x, gridZ: z, isPath: isPath };
                    
                    boardGroup.add(tileMesh);
                    boardTiles.push(tileMesh);

                    if (isPath) {
                        const pathTopGeo = new THREE.PlaneGeometry(CONFIG.cellSize - 0.1, CONFIG.cellSize - 0.1);
                        const pathTopMat = new THREE.MeshBasicMaterial({ color: 0x334155, side: THREE.DoubleSide });
                        const pathTop = new THREE.Mesh(pathTopGeo, pathTopMat);
                        pathTop.rotation.x = Math.PI / 2;
                        pathTop.position.set(
                            x * CONFIG.cellSize + CONFIG.cellSize / 2,
                            0.01,
                            z * CONFIG.cellSize + CONFIG.cellSize / 2
                        );
                        boardGroup.add(pathTop);
                    }
                }
            }
            scene.add(boardGroup);

            const lastPt = worldPathPoints[worldPathPoints.length - 1];
            const portalGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.2, 32);
            const portalMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e, wireframe: true });
            const portal = new THREE.Mesh(portalGeo, portalMat);
            portal.position.copy(lastPt);
            portal.position.y = 0.1;
            scene.add(portal);
        }

        function buildHelpers() {
            const geo = new THREE.BoxGeometry(CONFIG.cellSize, 0.08, CONFIG.cellSize);
            const mat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.4 });
            hoverTileMesh = new THREE.Mesh(geo, mat);
            hoverTileMesh.visible = false;
            scene.add(hoverTileMesh);

            const rangeGeo = new THREE.RingGeometry(0.1, 1, 32);
            const rangeMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, side: THREE.DoubleSide, transparent: true, opacity: 0.35 });
            rangeIndicatorMesh = new THREE.Mesh(rangeGeo, rangeMat);
            rangeIndicatorMesh.rotation.x = Math.PI / 2;
            rangeIndicatorMesh.visible = false;
            scene.add(rangeIndicatorMesh);
        }

        class Tower {
            constructor(typeKey, gridX, gridZ) {
                this.typeKey = typeKey;
                this.config = { ...TOWER_TYPES[typeKey] };
                this.gridX = gridX;
                this.gridZ = gridZ;
                this.level = 1;
                this.lastShotTime = 0;
                this.target = null;

                this.position = new THREE.Vector3(
                    gridX * CONFIG.cellSize + CONFIG.cellSize / 2,
                    0,
                    gridZ * CONFIG.cellSize + CONFIG.cellSize / 2
                );

                this.mesh = this.createMesh();
                this.mesh.position.copy(this.position);
                scene.add(this.mesh);
            }

            createMesh() {
                const group = new THREE.Group();

                const baseGeo = new THREE.CylinderGeometry(0.8, 0.9, 0.4, 16);
                const baseMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.3 });
                const base = new THREE.Mesh(baseGeo, baseMat);
                base.position.y = 0.2;
                base.castShadow = true;
                group.add(base);

                const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.8);
                const bodyMat = new THREE.MeshStandardMaterial({ color: this.config.color, metalness: 0.6, roughness: 0.2 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.9;
                body.castShadow = true;
                group.add(body);

                const headGroup = new THREE.Group();
                headGroup.position.y = 1.5;

                const headGeo = new THREE.SphereGeometry(0.5, 16, 16);
                const headMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8 });
                const head = new THREE.Mesh(headGeo, headMat);
                headGroup.add(head);

                const barrelGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.8, 12);
                const barrelMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.9 });
                const barrel = new THREE.Mesh(barrelGeo, barrelMat);
                barrel.rotation.x = Math.PI / 2;
                barrel.position.z = 0.4;
                headGroup.add(barrel);

                group.add(headGroup);
                this.headGroup = headGroup;

                return group;
            }

            update(now, delta) {
                if (!this.target || !enemies.includes(this.target) || this.position.distanceTo(this.target.mesh.position) > this.config.range) {
                    this.findTarget();
                }

                if (this.target) {
                    const targetPos = this.target.mesh.position.clone();
                    targetPos.y = this.headGroup.position.y;
                    this.headGroup.lookAt(targetPos);

                    if (now - this.lastShotTime >= this.config.fireRate) {
                        this.shoot();
                        this.lastShotTime = now;
                    }
                }
            }

            findTarget() {
                let closestEnemy = null;
                let maxProgress = -1;

                for (const enemy of enemies) {
                    const dist = this.position.distanceTo(enemy.mesh.position);
                    if (dist <= this.config.range) {
                        if (enemy.progress > maxProgress) {
                            maxProgress = enemy.progress;
                            closestEnemy = enemy;
                        }
                    }
                }
                this.target = closestEnemy;
            }

            shoot() {
                if (!this.target) return;

                if (this.config.type === "single" || this.config.type === "area" || this.config.type === "slow") {
                    projectiles.push(new Projectile(this, this.target));
                } else if (this.config.type === "beam") {
                    this.target.takeDamage(this.config.damage);
                    createLaserBeamEffect(this.headGroup.getWorldPosition(new THREE.Vector3()), this.target.mesh.position, this.config.color);
                }
            }

            upgrade() {
                this.level++;
                this.config.damage = Math.round(this.config.damage * 1.45);
                this.config.range += 0.4;
                this.mesh.scale.multiplyScalar(1.08);
            }

            destroy() {
                scene.remove(this.mesh);
            }
        }

        class Enemy {
            constructor(waveNumber) {
                this.isBoss = waveNumber % 5 === 0;
                this.hpMax = 40 + waveNumber * 35;
                if (this.isBoss) this.hpMax *= 3.5;
                
                this.hp = this.hpMax;
                this.speed = (1.8 + Math.min(waveNumber * 0.1, 1.2)) * (this.isBoss ? 0.7 : 1.0);
                this.baseSpeed = this.speed;
                this.bounty = (15 + waveNumber * 3) * (this.isBoss ? 4 : 1);
                
                this.pathIndex = 0;
                this.progress = 0;
                this.slowTimer = 0;

                this.mesh = this.createMesh();
                this.mesh.position.copy(worldPathPoints[0]);
                scene.add(this.mesh);
            }

            createMesh() {
                const size = this.isBoss ? 0.9 : 0.5;
                const geo = this.isBoss ? new THREE.DodecahedronGeometry(size) : new THREE.SphereGeometry(size, 16, 16);
                const mat = new THREE.MeshStandardMaterial({
                    color: this.isBoss ? 0xf43f5e : 0xa855f7,
                    roughness: 0.3,
                    metalness: 0.5,
                    emissive: this.isBoss ? 0x881337 : 0x3b0764,
                    emissiveIntensity: 0.4
                });

                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = size;
                mesh.castShadow = true;

                const barBgGeo = new THREE.PlaneGeometry(1.2, 0.18);
                const barBgMat = new THREE.MeshBasicMaterial({ color: 0x0f172a, side: THREE.DoubleSide });
                const barBg = new THREE.Mesh(barBgGeo, barBgMat);
                barBg.position.y = size + 0.6;
                barBg.rotation.x = -Math.PI / 6;

                const barFillGeo = new THREE.PlaneGeometry(1.16, 0.14);
                const barFillMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, side: THREE.DoubleSide });
                const barFill = new THREE.Mesh(barFillGeo, barFillMat);
                barFill.position.z = 0.01;
                barBg.add(barFill);
                mesh.add(barBg);

                this.healthBarFill = barFill;
                return mesh;
            }

            update(delta) {
                if (this.slowTimer > 0) {
                    this.slowTimer -= delta;
                    if (this.slowTimer <= 0) {
                        this.speed = this.baseSpeed;
                        this.mesh.material.color.setHex(this.isBoss ? 0xf43f5e : 0xa855f7);
                    }
                }

                if (this.pathIndex >= worldPathPoints.length - 1) return;

                const currentTarget = worldPathPoints[this.pathIndex + 1];
                const dir = new THREE.Vector3().subVectors(currentTarget, this.mesh.position);
                dir.y = 0;

                const distToTarget = dir.length();
                const step = this.speed * delta;

                if (distToTarget <= step) {
                    this.mesh.position.copy(currentTarget);
                    this.pathIndex++;
                    if (this.pathIndex >= worldPathPoints.length - 1) {
                        this.onReachBase();
                        return;
                    }
                } else {
                    dir.normalize();
                    this.mesh.position.addScaledVector(dir, step);
                    this.progress += step;
                }

                const hpRatio = Math.max(0, this.hp / this.hpMax);
                this.healthBarFill.scale.x = hpRatio;
            }

            applySlow(factor, duration) {
                this.speed = this.baseSpeed * (1 - factor);
                this.slowTimer = duration;
                this.mesh.material.color.setHex(0x38bdf8);
            }

            takeDamage(amount) {
                this.hp -= amount;
                if (this.hp <= 0) {
                    this.die();
                }
            }

            die() {
                addGold(this.bounty);
                createExplosion(this.mesh.position, 0xa855f7, 8);
                this.destroy();
            }

            // [라이프 1 차감 로직 반영]
            onReachBase() {
                lives -= 1;
                updateHUD();
                if (lives <= 0) {
                    triggerGameOver(false);
                }
                this.destroy();
            }

            destroy() {
                scene.remove(this.mesh);
                const idx = enemies.indexOf(this);
                if (idx > -1) enemies.splice(idx, 1);
            }
        }

        class Projectile {
            constructor(tower, target) {
                this.tower = tower;
                this.target = target;
                this.speed = 15;

                this.mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(0.18, 8, 8),
                    new THREE.MeshBasicMaterial({ color: tower.config.color })
                );

                const startPos = tower.headGroup.getWorldPosition(new THREE.Vector3());
                this.mesh.position.copy(startPos);
                scene.add(this.mesh);
            }

            update(delta) {
                if (!this.target || !enemies.includes(this.target)) {
                    this.destroy();
                    return;
                }

                const targetPos = this.target.mesh.position.clone();
                targetPos.y += 0.3;

                const dir = new THREE.Vector3().subVectors(targetPos, this.mesh.position);
                const dist = dir.length();
                const step = this.speed * delta;

                if (dist <= step) {
                    this.hit();
                } else {
                    dir.normalize();
                    this.mesh.position.addScaledVector(dir, step);
                }
            }

            hit() {
                const config = this.tower.config;

                if (config.type === "single") {
                    this.target.takeDamage(config.damage);
                } else if (config.type === "area") {
                    createExplosion(this.mesh.position, config.color, 14);
                    const enemyList = [...enemies];
                    for (const enemy of enemyList) {
                        if (enemy.mesh.position.distanceTo(this.mesh.position) <= config.splashRadius) {
                            enemy.takeDamage(config.damage);
                        }
                    }
                } else if (config.type === "slow") {
                    this.target.takeDamage(config.damage);
                    this.target.applySlow(config.slowFactor, config.slowDuration);
                }

                this.destroy();
            }

            destroy() {
                scene.remove(this.mesh);
                const idx = projectiles.indexOf(this);
                if (idx > -1) projectiles.splice(idx, 1);
            }
        }

        function createExplosion(pos, colorHex, count = 10) {
            for (let i = 0; i < count; i++) {
                const pGeo = new THREE.SphereGeometry(0.08, 4, 4);
                const pMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 1 });
                const particle = new THREE.Mesh(pGeo, pMat);
                particle.position.copy(pos);

                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 6,
                    Math.random() * 4 + 1,
                    (Math.random() - 0.5) * 6
                );

                scene.add(particle);
                particleEffects.push({ mesh: particle, vel: velocity, life: 0.35 });
            }
        }

        function createLaserBeamEffect(from, to, colorHex) {
            const geom = new THREE.BufferGeometry().setFromPoints([from, to]);
            const mat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 3 });
            const line = new THREE.Line(geom, mat);
            scene.add(line);

            setTimeout(() => scene.remove(line), 40);
        }

        function updateParticles(delta) {
            for (let i = particleEffects.length - 1; i >= 0; i--) {
                const p = particleEffects[i];
                p.life -= delta;
                p.mesh.position.addScaledVector(p.vel, delta);
                p.mesh.material.opacity = Math.max(0, p.life / 0.35);

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particleEffects.splice(i, 1);
                }
            }
        }

        function onPointerMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(boardTiles, false);

            if (intersects.length > 0 && selectedTowerType) {
                const hoveredTile = intersects[0].object.userData;
                const gx = hoveredTile.gridX;
                const gz = hoveredTile.gridZ;
                const isBuildable = gridMap[gx][gz] === 0;

                hoverTileMesh.position.set(
                    gx * CONFIG.cellSize + CONFIG.cellSize / 2,
                    0.05,
                    gz * CONFIG.cellSize + CONFIG.cellSize / 2
                );
                hoverTileMesh.material.color.setHex(isBuildable ? 0x22c55e : 0xef4444);
                hoverTileMesh.visible = true;

                const range = TOWER_TYPES[selectedTowerType].range;
                rangeIndicatorMesh.scale.set(range, range, 1);
                rangeIndicatorMesh.position.set(
                    gx * CONFIG.cellSize + CONFIG.cellSize / 2,
                    0.08,
                    gz * CONFIG.cellSize + CONFIG.cellSize / 2
                );
                rangeIndicatorMesh.visible = true;
            } else {
                if (!selectedPlacedTower) {
                    hoverTileMesh.visible = false;
                    rangeIndicatorMesh.visible = false;
                }
            }
        }

        function onPointerDown(event) {
            if (event.target.closest('#ui-layer')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length === 0) {
                if (!selectedTowerType) deselectAll();
                return;
            }

            for (const hit of intersects) {
                let obj = hit.object;
                while (obj.parent && obj.parent !== scene) {
                    obj = obj.parent;
                }
                const foundTower = towers.find(t => t.mesh === obj);

                if (foundTower) {
                    selectPlacedTower(foundTower);
                    return;
                }

                if (hit.object.userData && hit.object.userData.gridX !== undefined) {
                    const { gridX, gridZ } = hit.object.userData;

                    if (selectedTowerType) {
                        tryBuildTower(gridX, gridZ);
                    } else {
                        deselectAll();
                    }
                    return;
                }
            }
        }

        function tryBuildTower(gx, gz) {
            if (!selectedTowerType) return;
            if (gridMap[gx][gz] !== 0) return;

            const towerConfig = TOWER_TYPES[selectedTowerType];
            if (gold < towerConfig.cost) return;

            gold -= towerConfig.cost;
            gridMap[gx][gz] = 2;

            const newTower = new Tower(selectedTowerType, gx, gz);
            towers.push(newTower);

            updateHUD();

            if (gold < towerConfig.cost) {
                selectedTowerType = null;
                updateTowerCardSelection();
                hoverTileMesh.visible = false;
                rangeIndicatorMesh.visible = false;
            } else {
                hoverTileMesh.position.set(
                    gx * CONFIG.cellSize + CONFIG.cellSize / 2,
                    0.05,
                    gz * CONFIG.cellSize + CONFIG.cellSize / 2
                );
                hoverTileMesh.material.color.setHex(0xef4444);
            }
        }

        function selectPlacedTower(tower) {
            selectedTowerType = null;
            selectedPlacedTower = tower;
            updateTowerCardSelection();

            const infoPanel = document.getElementById('tower-info-panel');
            infoPanel.classList.remove('hidden');
            infoPanel.classList.add('flex');

            document.getElementById('info-tower-name').innerText = tower.config.name;
            document.getElementById('info-tower-level').innerText = `Lv.${tower.level}`;
            document.getElementById('info-tower-dmg').innerText = tower.config.damage;
            document.getElementById('info-tower-range').innerText = tower.config.range.toFixed(1);
            document.getElementById('info-tower-speed').innerText = `${tower.config.fireRate}s`;

            const upgradeCost = Math.round(tower.config.cost * 0.8 * tower.level);
            const sellPrice = Math.round(tower.config.cost * 0.6 * tower.level);

            document.getElementById('upgrade-cost').innerText = upgradeCost;
            document.getElementById('sell-price').innerText = sellPrice;

            document.getElementById('btn-upgrade-tower').disabled = gold < upgradeCost;

            rangeIndicatorMesh.scale.set(tower.config.range, tower.config.range, 1);
            rangeIndicatorMesh.position.set(tower.position.x, 0.08, tower.position.z);
            rangeIndicatorMesh.visible = true;
            hoverTileMesh.visible = false;
        }

        function deselectAll() {
            selectedTowerType = null;
            selectedPlacedTower = null;
            updateTowerCardSelection();
            document.getElementById('tower-info-panel').classList.add('hidden');
            hoverTileMesh.visible = false;
            rangeIndicatorMesh.visible = false;
        }

        function setupUIListeners() {
            document.querySelectorAll('.tower-card').forEach(card => {
                card.addEventListener('pointerdown', (e) => e.stopPropagation());
                
                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const type = card.dataset.towerType;
                    if (gold >= TOWER_TYPES[type].cost) {
                        selectedTowerType = selectedTowerType === type ? null : type;
                        selectedPlacedTower = null;
                        document.getElementById('tower-info-panel').classList.add('hidden');
                        updateTowerCardSelection();
                    }
                });
            });

            document.getElementById('btn-start-wave').addEventListener('click', (e) => {
                e.stopPropagation();
                startNextWave();
            });

            document.getElementById('btn-speed').addEventListener('click', (e) => {
                e.stopPropagation();
                gameSpeed = gameSpeed === 1 ? 2 : 1;
                document.getElementById('speed-text').innerText = `${gameSpeed}x`;
            });

            document.getElementById('btn-upgrade-tower').addEventListener('click', (e) => {
                e.stopPropagation();
                if (!selectedPlacedTower) return;
                const upgradeCost = Math.round(selectedPlacedTower.config.cost * 0.8 * selectedPlacedTower.level);
                if (gold >= upgradeCost) {
                    gold -= upgradeCost;
                    selectedPlacedTower.upgrade();
                    selectPlacedTower(selectedPlacedTower);
                    updateHUD();
                }
            });

            document.getElementById('btn-sell-tower').addEventListener('click', (e) => {
                e.stopPropagation();
                if (!selectedPlacedTower) return;
                const sellPrice = Math.round(selectedPlacedTower.config.cost * 0.6 * selectedPlacedTower.level);
                gold += sellPrice;

                gridMap[selectedPlacedTower.gridX][selectedPlacedTower.gridZ] = 0;
                selectedPlacedTower.destroy();
                const idx = towers.indexOf(selectedPlacedTower);
                if (idx > -1) towers.splice(idx, 1);

                deselectAll();
                updateHUD();
            });

            document.getElementById('btn-close-info').addEventListener('click', (e) => {
                e.stopPropagation();
                deselectAll();
            });

            document.getElementById('btn-restart').addEventListener('click', (e) => {
                e.stopPropagation();
                restartGame();
            });
        }

        function updateHUD() {
            document.getElementById('gold-display').innerText = gold;
            document.getElementById('lives-display').innerText = lives;
            document.getElementById('wave-display').innerText = `${currentWave} / ${CONFIG.maxWaves}`;

            document.querySelectorAll('.tower-card').forEach(card => {
                const type = card.dataset.towerType;
                if (gold < TOWER_TYPES[type].cost) {
                    card.classList.add('opacity-40', 'disabled');
                } else {
                    card.classList.remove('opacity-40', 'disabled');
                }
            });

            if (selectedPlacedTower) {
                const upgradeCost = Math.round(selectedPlacedTower.config.cost * 0.8 * selectedPlacedTower.level);
                document.getElementById('btn-upgrade-tower').disabled = gold < upgradeCost;
            }
        }

        function updateTowerCardSelection() {
            document.querySelectorAll('.tower-card').forEach(card => {
                if (card.dataset.towerType === selectedTowerType) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });
        }

        function startNextWave() {
            if (isWaveActive) return;
            if (currentWave >= CONFIG.maxWaves) return;

            currentWave++;
            isWaveActive = true;
            document.getElementById('btn-start-wave').disabled = true;
            document.getElementById('btn-start-wave').classList.add('opacity-50');
            updateHUD();

            const count = 6 + currentWave * 3;
            let spawned = 0;

            const spawnInterval = setInterval(() => {
                if (lives <= 0) {
                    clearInterval(spawnInterval);
                    return;
                }

                enemies.push(new Enemy(currentWave));
                spawned++;

                if (spawned >= count) {
                    clearInterval(spawnInterval);
                }
            }, 1200 / gameSpeed);
        }

        function addGold(amount) {
            gold += amount;
            updateHUD();
        }

        function triggerGameOver(isVictory) {
            isWaveActive = false;
            const modal = document.getElementById('game-over-modal');
            modal.classList.remove('hidden');

            const modalTitle = document.getElementById('modal-title');
            const modalDesc = document.getElementById('modal-desc');
            const modalIcon = document.getElementById('modal-icon');

            if (isVictory) {
                modalTitle.innerText = "VICTORY!";
                modalTitle.className = "text-3xl font-black font-orbitron text-emerald-400 mb-2 tracking-wider";
                modalDesc.innerText = "모든 웨이브의 침략자를 물리치고 기지를 지켜냈습니다!";
                modalIcon.className = "w-20 h-20 rounded-3xl bg-emerald-500/20 border-2 border-emerald-500/50 text-emerald-400 mx-auto flex items-center justify-center text-4xl mb-4 shadow-lg shadow-emerald-500/20 animate-pulse-subtle";
                modalIcon.innerHTML = '<i class="fa-solid fa-trophy"></i>';
            } else {
                modalTitle.innerText = "GAME OVER";
                modalTitle.className = "text-3xl font-black font-orbitron text-rose-500 mb-2 tracking-wider";
                modalDesc.innerText = "기지가 침략자에게 점령되었습니다.";
                modalIcon.className = "w-20 h-20 rounded-3xl bg-rose-500/20 border-2 border-rose-500/50 text-rose-400 mx-auto flex items-center justify-center text-4xl mb-4 shadow-lg shadow-rose-500/20 animate-pulse-subtle";
                modalIcon.innerHTML = '<i class="fa-solid fa-skull"></i>';
            }

            document.getElementById('final-wave').innerText = `Wave ${currentWave}`;
            document.getElementById('final-gold').innerText = `${gold} G`;
        }

        function restartGame() {
            gold = CONFIG.startingGold;
            lives = CONFIG.startingLives;
            currentWave = 0;
            isWaveActive = false;

            [...enemies].forEach(e => e.destroy());
            [...projectiles].forEach(p => p.destroy());
            [...towers].forEach(t => t.destroy());

            towers = [];
            enemies = [];
            projectiles = [];
            particleEffects = [];

            gridMap = Array(CONFIG.gridX).fill(null).map(() => Array(CONFIG.gridZ).fill(0));
            for (let i = 0; i < PATH_GRID.length - 1; i++) {
                const p1 = PATH_GRID[i];
                const p2 = PATH_GRID[i + 1];
                const minX = Math.min(p1[0], p2[0]);
                const maxX = Math.max(p1[0], p2[0]);
                const minZ = Math.min(p1[1], p2[1]);
                const maxZ = Math.max(p1[1], p2[1]);
                for (let x = minX; x <= maxX; x++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        gridMap[x][z] = 1;
                    }
                }
            }

            deselectAll();
            updateHUD();

            document.getElementById('game-over-modal').classList.add('hidden');
            document.getElementById('btn-start-wave').disabled = false;
            document.getElementById('btn-start-wave').classList.remove('opacity-50');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta() * gameSpeed;
            const now = clock.getElapsedTime();

            if (lives > 0) {
                enemies.forEach(enemy => enemy.update(delta));
                towers.forEach(tower => tower.update(now, delta));
                projectiles.forEach(proj => proj.update(delta));
                updateParticles(delta);

                if (isWaveActive && enemies.length === 0) {
                    isWaveActive = false;
                    document.getElementById('btn-start-wave').disabled = false;
                    document.getElementById('btn-start-wave').classList.remove('opacity-50');

                    if (currentWave >= CONFIG.maxWaves) {
                        triggerGameOver(true);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = function() {
            initEngine();
        };
    </script>
</body>
